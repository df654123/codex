name: Published vocabulary acceptance
on:
  push:
    branches: [vocab-live-20261108]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install browser driver and screenshot font
        run: |
          python3 -m pip install playwright==1.56.0
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
      - name: Verify actual public files, mobile interactions and offline records
        env:
          CHROME_BIN: /usr/bin/google-chrome
        run: python3 qa/verify_published_vocabulary.py
      - name: Save synthetic live evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vocabulary-live-evidence
          retention-days: 7
          path: qa/live-evidence/
          if-no-files-found: ignore
