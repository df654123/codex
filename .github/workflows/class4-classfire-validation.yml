name: Class4 ClassFire verification

on:
  push:
    branches:
      - 'class4/classfire-integration-20261108'
    paths:
      - '.github/workflows/class4-classfire-validation.yml'
      - 'class4/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: class4-${{ github.ref }}
  cancel-in-progress: true

env:
  UPSTREAM_REPO: QianKunBoss/ClassFire
  UPSTREAM_SHA: eabe5d6c8efd3f249e6ac284bad0ca2d2fdc5d8b

jobs:
  source-audit:
    name: Source and license audit
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: integration
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          persist-credentials: false
          path: upstream
      - name: Verify provenance and source completeness
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          test "$(git rev-parse HEAD)" = "$UPSTREAM_SHA"
          test -s LICENSE
          grep -q 'GNU GENERAL PUBLIC LICENSE' LICENSE
          test -s package-lock.json
          test -s Dockerfile
          test -d server/api
          test -d app/pages
          git ls-files > ../evidence/tracked-files.txt
          if git ls-files | grep -E '(^|/)(\.env$|[^/]*\.(db|sqlite|sqlite3)$)'; then
            echo 'Blocked: tracked runtime configuration or database needs review'
            exit 1
          fi
          git archive --format=tar.gz --prefix=classfire/ HEAD > ../evidence/classfire-upstream-source.tar.gz
          sha256sum ../evidence/classfire-upstream-source.tar.gz > ../evidence/source-sha256.txt
          printf '{"upstream":"%s","commit":"%s","sourceVerified":true,"productionAccepted":false}\n' "$UPSTREAM_REPO" "$UPSTREAM_SHA" > ../evidence/provenance.json
      - uses: actions/upload-artifact@v4
        with:
          name: class4-source-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  production-build:
    name: Locked production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          path: integration
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          persist-credentials: false
          path: upstream
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Apply reviewed class4 overlay when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f integration/class4/apply-overlay.mjs; then
            node integration/class4/apply-overlay.mjs upstream
          fi
      - name: Install exactly the locked dependencies
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ../evidence
          npm ci --no-audit --no-fund 2>&1 | tee ../evidence/install.log
      - name: Build application
        working-directory: upstream
        shell: bash
        run: |
          set -euo pipefail
          npm run build 2>&1 | tee ../evidence/build.log
          test -s .output/server/index.mjs
          test -d .output/public
          printf '{"build":"passed","upstream":"%s","commit":"%s","productionAccepted":false}\n' "$UPSTREAM_REPO" "$UPSTREAM_SHA" > ../evidence/build-result.json
      - name: Run integration tests when present
        shell: bash
        run: |
          set -euo pipefail
          if test -f integration/class4/tests/runtime.mjs; then
            node integration/class4/tests/runtime.mjs upstream 2>&1 | tee evidence/runtime-tests.log
          else
            printf '{"runtimeTests":"not_implemented","productionAccepted":false}\n' > evidence/runtime-result.json
          fi
      - name: Package candidate with full corresponding source
        shell: bash
        run: |
          set -euo pipefail
          tar --exclude='./.git' --exclude='./node_modules' --exclude='./.nuxt' --exclude='./data' --exclude='./.env' -czf evidence/classfire-candidate-with-source.tar.gz -C upstream .
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class4-build-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error

  dependency-audit:
    name: Dependency security report
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UPSTREAM_REPO }}
          ref: ${{ env.UPSTREAM_SHA }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Report dependency vulnerabilities without changing the lockfile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          set +e
          npm audit --package-lock-only --omit=dev --json > evidence/npm-audit.json
          result=$?
          set -e
          printf '{"auditExitCode":%s,"productionAccepted":false}\n' "$result" > evidence/audit-result.json
          exit "$result"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: class4-security-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
