  <script>
  /* LEARNING_STARTUP_GUARD */
  (function(){
    var failed=false, ready=false, styleFailed=false;
    function reportStyles(){
      window.LearningStartupStyleComplete=!styleFailed;
      var warning=document.getElementById('styleWarning');
      if(warning){warning.hidden=!styleFailed;if(styleFailed)warning.textContent='部分页面样式未完整加载，仍可继续学习。网络恢复后可重新载入页面。';}
    }
    function show(state,title,message){
      document.documentElement.setAttribute('data-learning-startup',state);
      var heading=document.getElementById('startupTitle'), detail=document.getElementById('startupDetail');
      if(heading) heading.textContent=title;
      if(detail) detail.textContent=message;
    }
    var timer=setTimeout(function(){if(!ready)show('slow','加载较慢，可以继续等待或重试','部分课程还在加载。你可以稍后重试，或使用已下载的独立学习文件。');},20000);
    document.addEventListener('error',function(event){
      var target=event.target;
      if(target && target.tagName==='LINK' && target.rel==='stylesheet'){
        styleFailed=true;reportStyles();return;
      }
      if(target && target.tagName==='SCRIPT' && target.src && target.src.split('?')[0].split('/').pop()==='offline-app.js'){
        var offline=document.getElementById('offlineStatus'), save=document.getElementById('offlineSave');
        if(offline) offline.textContent='离线准备暂不可用，可重试或使用独立学习文件';
        if(save) save.disabled=true;
        return;
      }
      if(target && target.tagName==='SCRIPT' && target.src){
        failed=true;
        show('failed','学习内容没有加载完整','请检查网络后重新载入；也可以使用已下载的独立学习文件。已保存在浏览器中的学习记录不会因此清空。');
      }
    },true);
    window.LearningStartup={complete:function(){
      clearTimeout(timer);
      reportStyles();
      var modules=['EnglishCore','CurriculumCore','ClassicsCore','WordStudyCore','LearningApp','Curriculum','Classics','ExamPath','WordStudy','LANGUAGE_FOCUS','WordMemoryCore','WordMemory','LiteracyCore','Literacy','ENGLISH_LITERACY','RW_PACKS','RWStore','RWApp'];
      if(!failed && modules.every(function(name){return !!window[name];})){
        ready=true;show('ready','','');window.LearningStartupReady=true;window.dispatchEvent(new Event('learning:ready'));
      }else show('failed','学习内容没有加载完整','请检查网络后重新载入；如果当前网址加载困难，可使用已下载的独立学习文件。');
    }};
  })();
  </script>

    #startupPanel h1{font-size:25px;margin:0 0 12px}#startupPanel button,#startupPanel a{display:inline-block;padding:10px 16px;margin:6px 6px 6px 0;border-radius:10px;border:1px solid #bfd3c8;background:white;color:#185b4e;font:inherit;text-decoration:none;cursor:pointer}
    #startupPanel small{display:block;color:#60736b;margin-top:14px}
  </style>

  <style>
    :root{
      --bg:#f5f8f4;
      --surface:#ffffff;
      --surface-soft:#eef5f1;
      --primary:#356a62;
      --primary-2:#4f8c7f;
      --accent:#f0b965;
      --blue:#6e93b7;
      --ink:#21332f;
      --muted:#6f7f7b;
      --line:#dfe9e5;
      --shadow:0 14px 38px rgba(47,83,75,.10);
      --radius:24px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:"Microsoft YaHei","PingFang SC","Noto Sans CJK SC",Arial,sans-serif;
      background:
        radial-gradient(circle at 10% 0%, rgba(240,185,101,.16), transparent 28%),
        radial-gradient(circle at 100% 8%, rgba(110,147,183,.14), transparent 30%),
        var(--bg);
      color:var(--ink);
    }
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    a{text-decoration:none;color:inherit}
    .app{min-height:100vh}
    .topbar{
      position:sticky;top:0;z-index:30;
      display:flex;align-items:center;justify-content:space-between;
      gap:18px;padding:14px 26px;
      background:rgba(255,255,255,.86);
      backdrop-filter:blur(18px);
      border-bottom:1px solid rgba(223,233,229,.9);
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:230px}
    .brand-mark{
      width:46px;height:46px;border-radius:16px;
      display:grid;place-items:center;
      background:linear-gradient(135deg,var(--primary),var(--primary-2));
      color:white;font-size:24px;box-shadow:var(--shadow)
    }
    .brand h1{font-size:18px;margin:0}
    .brand p{font-size:12px;margin:4px 0 0;color:var(--muted)}
    .top-actions{display:flex;align-items:center;gap:10px}
    .pill{
      border:1px solid var(--line);background:var(--surface);
      padding:10px 14px;border-radius:999px;color:var(--ink)
    }
    .primary-btn{
      border:none;color:white;background:linear-gradient(135deg,var(--primary),var(--primary-2));
      padding:11px 17px;border-radius:999px;box-shadow:0 8px 20px rgba(53,106,98,.2)
    }
    .layout{
      display:grid;grid-template-columns:250px minmax(0,1fr);
      gap:22px;max-width:1500px;margin:0 auto;padding:22px;
    }
    .sidebar{
      position:sticky;top:90px;height:calc(100vh - 112px);
      background:rgba(255,255,255,.78);backdrop-filter:blur(16px);
      border:1px solid var(--line);border-radius:28px;padding:16px;
      box-shadow:var(--shadow);overflow:auto
    }
    .profile-card{
      padding:16px;border-radius:20px;background:linear-gradient(145deg,#edf6f2,#fff8ec);
      margin-bottom:14px
    }
    .avatar{
      width:52px;height:52px;border-radius:50%;display:grid;place-items:center;
      background:white;font-size:24px;border:1px solid var(--line)
    }
    .profile-card strong{display:block;margin-top:12px}
    .profile-card small{color:var(--muted)}
    .level-line{display:flex;justify-content:space-between;margin-top:12px;font-size:12px}
    .mini-progress{height:7px;border-radius:99px;background:#dbe8e3;overflow:hidden;margin-top:6px}
    .mini-progress span{display:block;height:100%;width:62%;background:linear-gradient(90deg,var(--primary),var(--accent))}
    .nav{display:grid;gap:8px}
    .nav button{
      border:none;background:transparent;color:var(--ink);
      padding:12px 14px;border-radius:14px;text-align:left;
      display:flex;align-items:center;gap:11px
    }
    .nav button:hover,.nav button.active{background:var(--surface-soft);color:var(--primary);font-weight:700}
    .side-note{
      margin-top:16px;padding:14px;border-radius:18px;
      background:#fff8eb;border:1px solid #f3dfbc;font-size:13px;color:#7d5b24
    }
    main{min-width:0}
    .view{display:none}
    .view.active{display:block;animation:fade .35s ease}
    @keyframes fade{from{opacity:.4;transform:translateY(8px)}to{opacity:1;transform:none}}
    .hero{
      display:grid;grid-template-columns:1.35fr .65fr;gap:20px;
      background:linear-gradient(135deg,#2f6259,#4d8a7d);
      border-radius:32px;padding:34px;color:white;box-shadow:var(--shadow);overflow:hidden;position:relative
    }
    .hero:after{
      content:"";position:absolute;right:-50px;bottom:-80px;width:270px;height:270px;
      border-radius:50%;background:rgba(255,255,255,.09)
    }
    .eyebrow{font-size:13px;letter-spacing:.08em;text-transform:uppercase;opacity:.8}
    .hero h2{font-size:38px;line-height:1.2;margin:12px 0}
    .hero p{line-height:1.8;max-width:680px;color:rgba(255,255,255,.88)}
    .hero-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
    .hero .primary-btn{background:white;color:var(--primary)}
    .ghost-btn{
      border:1px solid rgba(255,255,255,.5);color:white;background:transparent;
      padding:11px 16px;border-radius:999px
    }
    .hero-card{
      position:relative;z-index:2;align-self:center;
      background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);
      padding:22px;border-radius:24px;backdrop-filter:blur(8px)
    }
    .hero-card .score{font-size:42px;font-weight:800}
    .hero-card small{color:rgba(255,255,255,.78)}
    .ring{
      width:112px;height:112px;border-radius:50%;
      display:grid;place-items:center;margin:14px auto 0;
      background:conic-gradient(#f7cf8e 0 70%,rgba(255,255,255,.18) 70% 100%);
      position:relative
    }
    .ring:after{content:"";width:78px;height:78px;border-radius:50%;background:#397066;position:absolute}
    .ring span{position:relative;z-index:2;font-weight:800;font-size:20px}
    .section-head{display:flex;align-items:end;justify-content:space-between;gap:16px;margin:28px 2px 14px}
    .section-head h3{margin:0;font-size:24px}
    .section-head p{margin:6px 0 0;color:var(--muted)}
    .section-head a{font-size:14px;color:var(--primary);font-weight:700}
    .grid-4{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
    .grid-2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}
    .card{
      background:var(--surface);border:1px solid var(--line);
      border-radius:var(--radius);padding:20px;box-shadow:0 8px 28px rgba(47,83,75,.06)
    }
    .card h4{margin:0 0 8px;font-size:18px}
    .card p{color:var(--muted);line-height:1.7}
    .icon-box{
      width:50px;height:50px;border-radius:16px;display:grid;place-items:center;
      font-size:24px;background:var(--surface-soft);margin-bottom:16px
    }
    .course-card{transition:.25s transform,.25s box-shadow}
    .course-card:hover{transform:translateY(-4px);box-shadow:var(--shadow)}
    .course-card .meta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px}
    .course-card .progress{height:8px;border-radius:99px;background:#e6eeeb;margin:16px 0 8px;overflow:hidden}
    .course-card .progress span{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--primary),var(--accent))}
    .task-list{display:grid;gap:10px;margin-top:16px}
    .task{
      display:flex;align-items:center;gap:12px;padding:13px 14px;border:1px solid var(--line);
      border-radius:16px;background:#fbfdfc
    }
    .task input{width:18px;height:18px;accent-color:var(--primary)}
    .task.completed{opacity:.65;text-decoration:line-through}
    .task span:last-child{margin-left:auto;color:var(--muted);font-size:12px}
    .stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
    .stat{
      padding:17px;border-radius:20px;background:linear-gradient(145deg,#fff,#f4f8f6);border:1px solid var(--line)
    }
    .stat strong{display:block;font-size:26px;margin-top:6px}
    .stat small{color:var(--muted)}
    .quote{
      border-left:4px solid var(--accent);padding:12px 16px;background:#fff9ef;
      border-radius:0 16px 16px 0;color:#6e552d;line-height:1.8
    }
    .unit-banner{
      background:linear-gradient(135deg,#eef7f3,#fff7ea);
      border:1px solid var(--line);border-radius:28px;padding:26px;display:flex;justify-content:space-between;gap:20px;align-items:center
    }
    .unit-banner h2{margin:0 0 8px;font-size:30px}
    .chip{display:inline-flex;align-items:center;gap:6px;padding:7px 10px;border-radius:999px;background:white;border:1px solid var(--line);font-size:12px}
    .lesson-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
    .lesson{
      min-height:160px;display:flex;flex-direction:column;justify-content:space-between;
      background:white;border:1px solid var(--line);border-radius:22px;padding:18px
    }
    .lesson .num{width:34px;height:34px;border-radius:12px;display:grid;place-items:center;background:var(--surface-soft);color:var(--primary);font-weight:800}
    .lesson button{border:none;background:transparent;color:var(--primary);text-align:left;padding:0;font-weight:700}
    .practice{
      background:#f8fbfa;border:1px solid var(--line);border-radius:20px;padding:18px;margin-top:16px
    }
    .question{font-weight:800;font-size:18px}
    .answers{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
    .answer{
      border:1px solid var(--line);background:white;border-radius:14px;padding:10px 16px
    }
    .answer.correct{background:#e8f5ef;border-color:#8ac5ad;color:#245c4e}
    .answer.wrong{background:#fff1ee;border-color:#edb5ac;color:#913d30}
    .feedback{margin-top:12px;color:var(--muted);min-height:24px}
    .reading-passage{
      padding:24px;border-radius:22px;background:#fcfdfc;border:1px solid var(--line);
      line-height:2;font-size:17px
    }
    .word{
      border-bottom:2px dotted #c29a52;cursor:pointer;position:relative
    }
    .word:hover:after{
      content:attr(data-tip);position:absolute;left:0;bottom:110%;white-space:nowrap;
      background:#243a35;color:white;padding:7px 9px;border-radius:10px;font-size:12px
    }
    .speaking-panel{
      background:linear-gradient(145deg,#edf6f3,#fff);border:1px solid var(--line);
      border-radius:26px;padding:24px
    }
    .dialogue{display:grid;gap:12px;margin-top:16px}
    .bubble{max-width:78%;padding:13px 16px;border-radius:18px;line-height:1.6}
    .bubble.ai{background:white;border:1px solid var(--line);border-bottom-left-radius:5px}
    .bubble.student{background:var(--primary);color:white;margin-left:auto;border-bottom-right-radius:5px}
    .speak-actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}
    .outline-btn{
      border:1px solid var(--line);background:white;color:var(--ink);
      padding:10px 14px;border-radius:999px
    }
    .radar{
      display:grid;place-items:center;min-height:260px;
      background:radial-gradient(circle,#fff 0 32%,#eef4f1 33% 35%,#fff 36% 52%,#eef4f1 53% 55%,#fff 56%);
      border-radius:24px;border:1px solid var(--line)
    }
    .radar ul{list-style:none;padding:0;margin:0;display:grid;gap:10px;width:70%}
    .radar li{display:grid;grid-template-columns:70px 1fr 36px;align-items:center;gap:10px;font-size:13px}
    .bar{height:8px;border-radius:99px;background:#e4ece9;overflow:hidden}
    .bar span{display:block;height:100%;background:linear-gradient(90deg,var(--blue),var(--primary))}
    .parent-note{padding:18px;border-radius:20px;background:#fff8ec;border:1px solid #f0debc}
    .ai-dock{
      position:fixed;right:24px;bottom:24px;z-index:50
    }
    .ai-toggle{
      width:60px;height:60px;border-radius:20px;border:none;color:white;font-size:26px;
      background:linear-gradient(135deg,var(--primary),var(--blue));box-shadow:var(--shadow)
    }
    .ai-panel{
      position:absolute;right:0;bottom:72px;width:min(360px,calc(100vw - 32px));
      background:white;border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);
      padding:16px;display:none
    }
    .ai-panel.open{display:block}
    .ai-panel h4{margin:0 0 6px}
    .ai-log{
      height:210px;overflow:auto;background:#f7faf8;border-radius:16px;padding:12px;
      display:grid;gap:10px;margin:12px 0
    }
    .ai-msg{padding:10px 12px;border-radius:14px;background:white;border:1px solid var(--line);line-height:1.6;font-size:14px}
    .ai-msg.user{background:var(--surface-soft)}
    .ai-input{display:flex;gap:8px}
    .ai-input input{flex:1;border:1px solid var(--line);border-radius:14px;padding:11px}
    .ai-input button{border:none;background:var(--primary);color:white;border-radius:14px;padding:0 14px}
    .notice{
      margin-top:18px;padding:14px 16px;border-radius:16px;background:#f0f5fa;border:1px solid #d7e3ee;
      color:#52677a;font-size:13px;line-height:1.7
    }
    footer{padding:26px 4px;color:var(--muted);font-size:13px;text-align:center}
    @media (max-width:1100px){
      .grid-4,.lesson-grid{grid-template-columns:repeat(2,1fr)}
      .grid-3{grid-template-columns:repeat(2,1fr)}
      .hero{grid-template-columns:1fr}
    }
    @media (max-width:780px){
      .topbar{padding:12px 16px}
      .brand p,.top-actions .pill{display:none}
      .layout{grid-template-columns:1fr;padding:14px}
      .sidebar{
        position:static;height:auto;overflow:visible;padding:10px
      }
      .profile-card,.side-note{display:none}
      .nav{display:flex;overflow:auto}
      .nav button{white-space:nowrap}
      .hero{padding:24px}
      .hero h2{font-size:30px}
      .grid-4,.grid-3,.grid-2,.stats,.lesson-grid{grid-template-columns:1fr}
      .unit-banner{align-items:flex-start;flex-direction:column}
      .ai-dock{right:14px;bottom:14px}
    }

    .audio-module{
      margin-top:18px;padding:18px 20px;border:1px solid #d7e7e1;border-radius:22px;
      background:linear-gradient(135deg,#f0f8f5,#fffaf0);display:flex;align-items:center;
      justify-content:space-between;gap:16px;flex-wrap:wrap
    }
    .audio-module-info{display:flex;align-items:center;gap:14px;min-width:240px}
    .audio-wave{
      width:52px;height:52px;border-radius:17px;display:grid;place-items:center;color:white;font-size:24px;
      background:linear-gradient(135deg,var(--primary),var(--blue));box-shadow:0 8px 20px rgba(53,106,98,.18)
    }
    .audio-module h4{margin:0 0 5px}
    .audio-module p{margin:0;color:var(--muted);font-size:13px}
    .audio-buttons{display:flex;gap:8px;flex-wrap:wrap}
    .audio-btn{
      border:1px solid var(--line);background:white;color:var(--ink);padding:9px 13px;border-radius:999px
    }
    .audio-btn:hover{border-color:#9bbfb3;color:var(--primary)}
    .audio-btn.main{background:var(--primary);border-color:var(--primary);color:white}
    .audio-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
    .audio-word{
      border:1px solid var(--line);background:white;border-radius:16px;padding:12px;text-align:left;
      display:flex;justify-content:space-between;align-items:center;gap:8px
    }
    .audio-word small{display:block;color:var(--muted);margin-top:3px}
    .audio-word span:last-child{font-size:18px}
    .audio-bar{
      position:fixed;left:50%;bottom:18px;transform:translate(-50%,130%);z-index:80;
      width:min(760px,calc(100vw - 32px));background:rgba(255,255,255,.96);backdrop-filter:blur(18px);
      border:1px solid var(--line);border-radius:22px;box-shadow:0 18px 45px rgba(34,65,58,.2);
      padding:12px 14px;display:grid;grid-template-columns:auto minmax(100px,1fr) auto;gap:12px;align-items:center;
      opacity:0;pointer-events:none;transition:.28s
    }
    .audio-bar.active{transform:translate(-50%,0);opacity:1;pointer-events:auto}
    .audio-main-control{
      width:42px;height:42px;border:none;border-radius:14px;background:var(--primary);color:white;font-size:18px
    }
    .audio-track{min-width:0}
    .audio-title{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .audio-time{font-size:11px;color:var(--muted);margin-top:3px}
    .audio-seek{width:100%;height:5px;accent-color:var(--primary)}
    .audio-controls{display:flex;align-items:center;gap:7px}
    .audio-controls button,.audio-controls select{
      border:1px solid var(--line);background:white;border-radius:12px;padding:8px;color:var(--ink)
    }
    body.audio-active .ai-dock{bottom:100px}
    @media (max-width:780px){
      .audio-grid{grid-template-columns:repeat(2,1fr)}
      .audio-bar{grid-template-columns:auto 1fr;bottom:10px}
      .audio-controls{grid-column:1/-1;justify-content:center}
      body.audio-active .ai-dock{bottom:145px}
    }
  
    html{-webkit-text-size-adjust:100%}
